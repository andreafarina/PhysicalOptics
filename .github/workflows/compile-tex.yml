name: Compile LaTeX PDF
on: 
  push: # Si attiva ogni volta che Overleaf fa un push su GitHub
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: handbook.tex # Cambialo con il nome del tuo file principale
          working_directory: docs/handbook/
          work_in_root_file_dir: true

      - name: Upload PDF to Repository
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add docs/handbook/handbook.pdf # O il nome del tuo PDF generato
          git commit -m "Automated PDF compilation" || exit 0
          git push
